<!-- En-tête premium -->
<div class="an-header">
  <div class="an-header-left">
    <div class="an-eyebrow">Import intelligent</div>
    <h1 class="an-title">Déposer une <span>facture</span></h1>
    <p class="an-subtitle">Glissez vos fichiers ou paramétrez l’extraction</p>
  </div>
  <div class="live-badge">
    <div class="live-dot"></div>
    OCR actif
  </div>
</div>

<!-- Zone principale -->
<div class="card-custom mb-4">
  <!-- Dropzone seule -->
  <div id="upload-area" class="upload-zone">
    <i class="fas fa-cloud-upload-alt"></i>
    <h5 class="fw-semibold mt-3">Glissez votre facture ici ou cliquez pour parcourir</h5>
    <p class="text-muted">PDF, PNG, JPG (max 10 Mo)</p>
    <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.xlsx,.xls" style="display:none;" multiple />
    <button class="btn btn-outline-primary mt-2" id="browse-btn">
      <i class="fas fa-folder-open me-1"></i> Parcourir
    </button>
  </div>

  <!-- File d'attente -->
  <div id="file-queue" class="mt-4" style="display: none;">
    <h6 class="fw-bold mb-2" style="font-family: var(--font-mono); text-transform: uppercase; font-size: 11px;">
      📎 Fichiers sélectionnés
    </h6>
    <div id="queue-list" class="d-flex flex-column gap-2"></div>
  </div>

 

  <!-- Bouton d'extraction -->
  <div class="mt-4">
    <button id="extract-btn" class="btn-analyse w-100 py-3" disabled>
      <i class="fas fa-magic me-2"></i> Lancer l’extraction
    </button>
  </div>
</div>

<!-- Résultats (généré dynamiquement) -->
<div id="extraction-results" style="display: none;"></div>
