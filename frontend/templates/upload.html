<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="fw-bold" style="color: #1e293b;"><i class="fas fa-file-invoice me-2" style="color: var(--primary);"></i>Déposer une facture</h2>
</div>
<div class="card-custom">
  <div id="upload-area" class="upload-zone">
    <i class="fas fa-cloud-upload-alt" style="font-size: 52px; color: var(--primary); margin-bottom: 16px;"></i>
    <h5 class="fw-semibold">Glissez votre facture ici ou cliquez pour parcourir</h5>
    <p class="text-muted">PDF, PNG, JPG, Excel (max 10 Mo)</p>
    <input type="file" id="file-input" accept=".pdf,.png,.jpg,.jpeg,.xlsx,.xls" style="display: none;" />
    <button class="btn btn-outline-primary mt-2" id="browse-btn"><i class="fas fa-folder-open me-1"></i> Parcourir</button>
  </div>
  <div id="selected-file-info" class="mt-3 text-muted" style="display: none;"></div>
  <div class="mt-4">
    <button id="extract-btn" class="btn btn-primary w-100 py-3" disabled>
      <i class="fas fa-magic me-2"></i>Lancer l'extraction
    </button>
  </div>
</div>
<div id="extraction-results" style="display: none;"></div>
